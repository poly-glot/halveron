<section class="newsletter" aria-labelledby="newsletter-title">
    <div class="container">
        <h2 class="heading newsletter__title" id="newsletter-title">Sign up for the Halveron newsletter</h2>
        <form class="newsletter__form" action="#" method="post">
            <div class="field newsletter__field">
                <label class="visually-hidden" for="newsletter-email">Email address</label>
                <input class="field__control" id="newsletter-email" type="email" name="email" placeholder="Enter your email address…" autocomplete="email" required aria-describedby="newsletter-hint">
            </div>
            <button class="button" type="submit">Sign up</button>
        </form>
        <p class="newsletter__text">A short monthly note on service operations: what we are seeing with clients, new research, and dates for courses and forum meetings.</p>
        <p class="newsletter__hint" id="newsletter-hint">This is a demonstration site. Your email address is not sent or stored.</p>
    </div>
</section>
